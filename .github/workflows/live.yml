name: Harga terkini (24 jam)

on:
  schedule:
    # Crypto berdagang 24/7 — setiap 30 minit
    - cron: "10,40 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: procoin-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q yfinance requests
      - name: Tarik harga terkini
        run: python scripts/live.py
      - name: Simpan
        run: |
          git config user.name "procoin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          if ! git diff --cached --quiet; then
            git commit -qm "Harga terkini"
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          fi
