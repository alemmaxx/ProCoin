name: Bina APK ProCoin

on:
  push:
    branches: [main]
    paths: ["index.html", "android-signing/**", "manifest.webmanifest", "privacy.html", "icons/**", "android-icons/**", "capacitor.config.json", "package.json", ".github/workflows/apk.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: procoin-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Sediakan fail web (data diambil terus dari GitHub Pages)
        run: mkdir -p www && cp -r index.html manifest.webmanifest privacy.html icons www/
      - name: Kunci tandatangan tetap (supaya APK baru boleh dikemas kini atas APK lama)
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - name: Ikon app & ikon notifikasi
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          cp -r android-icons/res/* $RES/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0a1210</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
      - name: Kebenaran notifikasi
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Guna kunci tandatangan tetap dalam Gradle
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../android-signing/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
              }
          }
          GRADLE
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ProCoin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ProCoin-apk
          path: ProCoin.apk
      - name: Terbit ke Release "latest" (muat turun terus dari telefon)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ProCoin APK (terkini)
          body: "Muat turun ProCoin.apk di bawah dan pasang di telefon Android."
          files: ProCoin.apk
          make_latest: true
      - name: Kemas kini salinan APK di laman (GitHub Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --ref main -R ${{ github.repository }}
