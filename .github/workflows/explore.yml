name: Kajian penerokaan isyarat (kos sebenar)

on:
  workflow_dispatch: {}
  schedule:
    # Setiap Ahad 11.10 pagi waktu Malaysia
    - cron: "10 3 * * 0"
  push:
    branches: [main]
    paths: ["scripts/explore.py"]

permissions:
  contents: write

concurrency:
  group: procoin-explore
  cancel-in-progress: true

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q yfinance pandas numpy requests
      - name: Uji isyarat calon dengan kos sebenar
        run: python scripts/explore.py
      - name: Simpan keputusan
        run: |
          git config user.name "procoin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/explore.json
          if ! git diff --cached --quiet; then
            git commit -qm "Kajian: penerokaan isyarat (kos sebenar)"
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          fi
