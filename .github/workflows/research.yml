name: Kajian backtest penapis

on:
  schedule:
    # Setiap Ahad 10.40 pagi waktu Malaysia
    - cron: "40 2 * * 0"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/research.py", "scripts/backtest.py", "scripts/strategies.py"]

permissions:
  contents: write

concurrency:
  group: procoin-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q yfinance pandas numpy requests
      - name: Backtest penapis isyarat
        run: python scripts/research.py
      - name: Simpan keputusan
        run: |
          git config user.name "procoin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research.json
          if ! git diff --cached --quiet; then
            git commit -qm "Kajian: keputusan backtest penapis"
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          fi
