name: Pemantau sistem (setiap jam)

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: procoin-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Semak sistem
        run: python scripts/health.py
      - name: Simpan status (hanya bila berubah)
        run: |
          git config user.name "procoin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json
          if ! git diff --cached --quiet; then
            git commit -qm "Status sistem: $(python3 -c "import json;print(json.load(open('data/status.json'))['level'])")"
            for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          fi
